<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>契约换版台 · 登录</title>
  <link rel="stylesheet" href="/static/css/schema.css" />
</head>
<body class="login-body">
  <main class="login-panel">
    <p class="eyebrow">契约换版台</p>
    <h1>登录</h1>
    <form id="f">
      <label>账号<input name="username" value="admin" autocomplete="username" /></label>
      <label>密码<input name="password" type="password" value="123456" autocomplete="current-password" /></label>
      <button type="submit" class="primary">进入换版台</button>
      <p id="err" class="err"></p>
    </form>
  </main>
  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') })
      });
      const j = await r.json();
      if (!r.ok) { document.getElementById('err').textContent = j.error || '登录失败'; return; }
      location.href = '/app/';
    };
  </script>
</body>
</html>
